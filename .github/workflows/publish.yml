name: Publish to Gradle Plugin Portal

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish (without v prefix), e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure a "release" environment for an approval gate before publishing.
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      
      - name: Get Vault secrets
        id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@e46fe1e9a2bf9e618bcf8d8d32f3a7381b45c06d # get-vault-secrets/v2.0.0
        with:
          vault_instance: dev
          repo_secrets: |
            GRADLE_PUBLISH_KEY=gradle-publish-credentials:GRADLE_PUBLISH_KEY
            GRADLE_PUBLISH_SECRET=gradle-publish-credentials:GRADLE_PUBLISH_SECRET
      
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"
      
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
        with:
          gradle-version: "8.10"
          cache-disabled: true
      
      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${DISPATCH_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Publish plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ env.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ env.GRADLE_PUBLISH_SECRET }}
        run: gradle publishPlugins --no-daemon --stacktrace -Pversion=${{ steps.version.outputs.version }}
