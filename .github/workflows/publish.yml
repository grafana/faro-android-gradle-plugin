name: Publish to Gradle Plugin Portal

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish (without v prefix), e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure a "release" environment for an approval gate before publishing.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Get Vault secrets
        id: get-secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3 # get-vault-secrets/v2.1
        with:
          vault_instance: dev
          repo_secrets: |
            GRADLE_PUBLISH_KEY=gradle-publish-credentials:GRADLE_PUBLISH_KEY
            GRADLE_PUBLISH_SECRET=gradle-publish-credentials:GRADLE_PUBLISH_SECRET
      
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"
          cache-disabled: true
      
      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${DISPATCH_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Publish plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ env.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ env.GRADLE_PUBLISH_SECRET }}
        run: gradle publishPlugins --no-daemon --stacktrace -Pversion=${{ steps.version.outputs.version }}
